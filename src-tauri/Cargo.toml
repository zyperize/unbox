[package]
name = "space"
version = "0.1.0"
description = "Neo-brutalist disk space analyzer"
authors = ["space contributors"]
edition = "2021"

[lib]
name = "space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
sysinfo = "0.32"

